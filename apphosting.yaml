# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Increase the request timeout to allow for longer-running server-side
  # operations, such as generative AI requests.
  timeoutSeconds: 120

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_HOSTING_BACKEND
    secret: NEXT_PUBLIC_APP_HOSTING_BACKEND
    availability:
      - RUNTIME
      - BUILD

  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    availability:
      - RUNTIME
      - BUILD

  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - RUNTIME
      - BUILD

  - variable: CARTORIO_API_URL
    secret: CARTORIO_API_URL
    availability:
      - RUNTIME