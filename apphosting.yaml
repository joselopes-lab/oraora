# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Increase the request timeout to allow for longer-running server-side
  # operations, such as generative AI requests.
  timeoutSeconds: 120

env:
# Referência para a GEMINI_API_KEY armazenada no Secret Manager
# O nome 'gemini-api-key' deve corresponder ao nome que você deu ao segredo.
- variable: GEMINI_API_KEY
  secret: GEMINI_API_KEY
  availability:
    - RUNTIME # Disponível apenas durante o tempo de execução

# Referência para a NEXT_PUBLIC_GOOGLE_MAPS_API_KEY armazenada no Secret Manager
# O nome 'google-maps-api-key' deve corresponder ao nome que você deu ao segredo.
# Use o prefixo 'NEXT_PUBLIC_' se for para uma aplicação Next.js no frontend.

- variable: NEXT_PUBLIC_APP_HOSTING_BACKEND
  secret: NEXT_PUBLIC_APP_HOSTING_BACKEND
  availability:
    - RUNTIME # Disponível apenas durante o tempo de execução
    - BUILD   # Se sua aplicação precisar dela durante a fase de build (ex: Next.js SSG)

- variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
  secret: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
  availability:
    - RUNTIME # Disponível apenas durante o tempo de execução
    - BUILD   # Se sua aplicação precisar dela durante a fase de build (ex: Next.js SSG)

- variable: GOOGLE_GENAI_API_KEY
  secret: GOOGLE_GENAI_API_KEY
  availability:
    - RUNTIME # Disponível apenas durante o tempo de execução
    - BUILD   # Se sua aplicação precisar dela durante a fase de build (ex: Next.js SSG)

- variable: GOOGLE_GENAI_API_KEY
  secret: GOOGLE_GENAI_API_KEY
  availability:
    - RUNTIME # Disponível apenas durante o tempo de execução

- variable: CARTORIO_API_URL
  secret: CARTORIO_API_URL
  availability:
    - RUNTIME # Disponível apenas durante o tempo de execução